<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Skillmaxing launch ad</title>
<!--
  Worked example (the Skillmaxing launch ad): the picture, one frame at a time: render(t) draws the state at t seconds.
  Every value is computed from t (no CSS transitions), so scripts/build.py can step it frame by frame.
  Open it in a browser with #t=12.5 to look at one moment, or #play to watch it run.
-->
<style>
@font-face{font-family:G;src:url(fonts/OverusedGrotesk-Roman.ttf);font-weight:400}
@font-face{font-family:G;src:url(fonts/OverusedGrotesk-Medium.ttf);font-weight:500}
@font-face{font-family:G;src:url(fonts/OverusedGrotesk-SemiBold.ttf);font-weight:600}
@font-face{font-family:G;src:url(fonts/OverusedGrotesk-Bold.ttf);font-weight:700}
:root{--ink:#1C1A2B;--ink2:#2A2F7A;--mut:#8C8AA3;--line:rgba(59,56,84,.12);--blue:#4C5FD7;--peri:#7C8CF8;--sky:#5B9CF6}
html,body{margin:0;background:#F4F4FA;overflow:hidden}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:G,system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(130% 100% at 50% 42%,#FBFBFE 0%,#F4F4FA 58%,#ECECF5 100%)}
.layer{position:absolute;left:0;top:0;width:1920px;height:1080px}
.abs{position:absolute;left:0;top:0}
.w{position:absolute;left:0;top:0;white-space:nowrap;line-height:1.08;letter-spacing:-.025em;padding:0 .04em}
.g1{background:linear-gradient(95deg,#3E54D8 0%,#5F74F2 55%,#6FA9FF 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.g2{background:linear-gradient(95deg,#6C7EF6 0%,#79B5FF 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.navy{color:var(--ink2)} .mut{color:#9A98B0} .ink{color:var(--ink)} .blue{color:var(--blue)} .sky{color:#4F9BF5} .peri{color:#7C8CF8}

.folder .fb:before{content:"";position:absolute;left:0;top:-14px;width:84px;height:34px;border-radius:14px 14px 0 0;background:#3B57EA}
.folder .pp{position:absolute;width:150px;height:118px;border-radius:12px;background:#fff;box-shadow:0 2px 6px rgba(20,20,70,.18)}
.folder .p1{left:24px;top:26px;transform:rotate(-7deg);background:#E6E9FD}
.folder .p2{left:28px;top:20px;transform:rotate(5deg);background:#F4F5FE}
.folder .p3{left:20px;top:28px;display:flex;align-items:flex-start;justify-content:center;padding-top:14px;box-sizing:border-box}
.folder .ff{position:absolute;left:-2px;top:78px;width:194px;height:100px;border-radius:18px;

.folder .lbl{position:absolute;left:16px;bottom:26px;color:#fff;font-size:21px;font-weight:500;letter-spacing:-.01em}

.card .ct{margin-top:12px;font-size:20px;font-weight:500;color:var(--ink);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:26px}

.bigrow img{width:134px;height:76px;object-fit:cover;border-radius:12px}

/* phones: only the top of each phone is ever in shot, so that is all that is built */

.ui .vid .play{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 6px 16px rgba(60,80,200,.25)}
.ui .vid .play:after{content:"";position:absolute;left:18px;top:14px;border-left:14px solid #4C5FD7;border-top:9px solid transparent;border-bottom:9px solid transparent}
.ui .scrub{position:absolute;left:14px;right:14px;bottom:12px;height:5px;border-radius:3px;background:rgba(76,95,215,.18)}
.ui .scrub i{display:block;height:100%;width:30%;border-radius:3px;background:linear-gradient(90deg,#4C5FD7,#7C8CF8)}
.ui .t1{font-size:21px;font-weight:600;padding:14px 20px 4px;letter-spacing:-.01em}
.ui .t2{font-size:13px;color:#8C8AA3;padding:0 20px}
.ui p{font-size:15px;line-height:1.5;margin:8px 20px;color:#3B3854}

.ui .bub{margin:8px 16px;padding:12px 14px;border-radius:18px;font-size:15px;line-height:1.4}
.ui .me{margin-left:78px;background:#1C1A2B;color:#fff;border-bottom-right-radius:6px}
.ui .ai{margin-right:36px;background:#F1F3FF;color:#2A2F7A;border-bottom-left-radius:6px}
.ui .fig{margin:8px 16px;border-radius:14px;overflow:hidden;height:130px}
.ui .fig .art{height:100%;aspect-ratio:auto}
.ui .dots{display:flex;gap:5px} .ui .dots i{width:24px;height:5px;border-radius:3px;background:#E3E6FB} .ui .dots i.on{background:#4C5FD7}

/* the courses window the folder opens into */
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:26px}
.course{border:1.5px solid rgba(59,56,84,.12);border-radius:18px;overflow:hidden;background:#fff}
.course .art{border-radius:0;aspect-ratio:16/10}
.course .cb{padding:14px 16px 16px}
.course .cn{font-size:19px;font-weight:600;letter-spacing:-.01em}
.course .cmeta{font-size:13px;color:#8C8AA3;margin-top:5px}
.course .prog{margin-top:12px;height:6px;border-radius:3px;background:#ECEEFB}
.course .prog i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#4C5FD7,#7C8CF8)}

.bar{position:absolute;border-radius:60px;background:linear-gradient(90deg,#C6CCFF 0%,#7C8CF8 22%,#4557E6 45%,#6C84FA 72%,#8CCBFF 100%);
  box-shadow:0 26px 40px -14px rgba(76,110,240,.55)}
.ring{position:absolute;width:250px;height:250px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#FFFFFF 0%,#F2F4FF 60%,#E6EAFF 100%);
  box-shadow:0 0 0 3px rgba(110,140,250,.55),0 40px 70px -24px rgba(76,95,215,.55),inset 0 -10px 30px rgba(120,140,250,.18)}
.conf{position:absolute;left:0;top:0}
#cursor{position:absolute;left:0;top:0;width:78px;height:78px;z-index:50;visibility:hidden;filter:drop-shadow(0 6px 8px rgba(20,20,60,.25))}
.wcur{position:absolute;width:64px;height:64px;left:0;top:0;z-index:20;filter:drop-shadow(0 5px 6px rgba(20,20,60,.25))}
</style>

<body>
<div id="stage"></div>
<script>
"use strict";
const stage = document.getElementById("stage");

// ------------------------------------------------------------------ easing and helpers
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, u) => a + (b - a) * u;
const E = {
  lin: u => u,
  out: u => 1 - Math.pow(1 - u, 3),
  out5: u => 1 - Math.pow(1 - u, 5),
  in: u => u * u * u,
  in2: u => u * u,
  io: u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2,
  back: u => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2); },
};
const P = (t, t0, t1, e = E.out) => e(clamp((t - t0) / (t1 - t0)));
// keyframes [[time, value, ease?], ...]; the ease on a key shapes the segment arriving at it
function K(t, ks, e = E.io) {
  if (t <= ks[0][0]) return ks[0][1];
  for (let i = 1; i < ks.length; i++) {
    if (t <= ks[i][0]) { const [t0, v0] = ks[i - 1], [t1, v1, ee] = ks[i]; return lerp(v0, v1, (ee || e)(clamp((t - t0) / (t1 - t0)))); }
  }
  return ks[ks.length - 1][1];
}
function mk(tag, cls, parent, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  (parent || stage).appendChild(e);
  return e;
}
function css(el, { x = 0, y = 0, s = 1, sx = 1, sy = 1, r = 0, o = 1, b = 0, pre = "", post = "" }) {
  el.style.opacity = o.toFixed(4);
  el.style.visibility = o <= 0.002 ? "hidden" : "visible";
  el.style.transform = `${pre} translate(${x.toFixed(2)}px,${y.toFixed(2)}px) scale(${(s * sx).toFixed(4)},${(s * sy).toFixed(4)}) rotate(${r.toFixed(3)}deg) ${post}`;
  el.style.filter = b > 0.08 ? `blur(${b.toFixed(2)}px)` : "none";
}
function show(layer, on) { layer.style.display = on ? "block" : "none"; }
function layer() { return mk("div", "layer", stage); }

// word in / out: blur-in from the right, blur-out in place
function ws(t, tin, tout, o = {}) {
  const din = o.din || 0.42, dout = o.dout || 0.24;
  const e = E.out5(clamp((t - tin) / din));
  let op = clamp((t - tin) / (din * 0.5)), b = (1 - e) * (o.blur ?? 16), dx = (1 - e) * (o.dx ?? 44), s = lerp(o.s0 ?? 1.08, 1, e);
  const w = o.w0 ? 1 : E.io(clamp((t - tin) / (o.wd || 0.5)));
  if (tout != null && t > tout) { const v = E.in2(clamp((t - tout) / dout)); op *= 1 - v; b += v * (o.bout ?? 22); s *= 1 + (o.sout ?? -0.06) * v; dx += (o.dxout ?? 0) * v; }
  return { w, o: t < tin ? 0 : op, b, dx, s };
}

// A row of words (or elements) that re-centres as members arrive. `w` in a spec is how much room it takes.
class Line {
  constructor(parent, parts, o = {}) {
    this.size = o.size || 96; this.cx = o.cx ?? 960; this.cy = o.cy ?? 540; this.gap = (o.gap ?? 0.27) * this.size;
    this.items = parts.map(p => {
      let el;
      if (p.el) { el = p.el; parent.appendChild(el); }
      else { el = mk("div", "w " + (p.cls || ""), parent, p.text); el.style.fontSize = this.size + "px"; el.style.fontWeight = p.fw || o.fw || 400; }
      return { el, dy: p.dy || 0, gap: p.gap, w: 0, h: 0, x: 0 };
    });
  }
  measure() { for (const it of this.items) { it.w = it.el.offsetWidth; it.h = it.el.offsetHeight; } }
  place(specs) {
    let total = 0;
    this.items.forEach((it, i) => { total += specs[i].w * (it.w + (i ? (it.gap ?? this.gap) : 0)); });
    let x = this.cx - total / 2;
    this.items.forEach((it, i) => {
      const sp = specs[i];
      if (i) x += sp.w * (it.gap ?? this.gap);
      it.x = x;
      css(it.el, { x: x + (sp.dx || 0), y: this.cy - it.h / 2 + it.dy + (sp.dy || 0), s: sp.s ?? 1, o: sp.o ?? 1, b: sp.b || 0, r: sp.r || 0 });
      x += sp.w * it.w;
    });
  }
  end(i) { const it = this.items[i]; return it.x + it.w; }
}

// ------------------------------------------------------------------ shared art
const MARK = (stroke = "currentColor", sw = 1.7) => `<svg viewBox="0 0 32 32" width="100%" height="100%" fill="none" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round">
  <rect class="b1" x="3.5" y="19.5" width="6" height="8" rx="1"/><rect class="b2" x="13" y="13.5" width="6" height="14" rx="1"/><rect class="b3" x="22.5" y="7.5" width="6" height="20" rx="1"/>
  <path class="ar" d="M5 13l7.5-5 6 3.5L27 3.5"/><path class="ah" d="M22 3.5h5v5"/></svg>`;
const HAND = `<svg viewBox="0 0 32 32" width="100%" height="100%"><path d="M11 3.5c-1.1 0-2 .9-2 2v11.2l-1.6-1.7c-.8-.8-2-.8-2.8 0-.7.7-.8 1.8-.2 2.6l5.3 7.3c1.1 1.6 3 2.6 5 2.6h4.8c3.3 0 6-2.7 6-6v-7c0-1.1-.9-2-2-2s-2 .9-2 2v-1c0-1.1-.9-2-2-2s-2 .9-2 2v-1c0-1.1-.9-2-2-2s-2 .9-2 2V5.5c0-1.1-.9-2-2-2z" fill="#fff" stroke="#1B1A2E" stroke-width="1.45" stroke-linejoin="round"/><path d="M13.5 12.6v4.2M17.5 13.6v3.6M21.5 14.6v3" stroke="#1B1A2E" stroke-width="1.2" stroke-linecap="round"/></svg>`;
const HOT = [11.25 / 32, 3.6 / 32];     // the fingertip, as a fraction of the cursor box
const STAR = `M0,-100 C9,-24 24,-9 100,0 C24,9 9,24 0,100 C-9,24 -24,9 -100,0 C-24,-9 -9,-24 0,-100 Z`;
const SPARK = (id) => `<svg viewBox="-110 -110 220 220" width="100%" height="100%" style="overflow:visible"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3550E6"/><stop offset=".55" stop-color="#5E7CF8"/><stop offset="1" stop-color="#8FD0FF"/></linearGradient></defs><path d="${STAR}" fill="url(#${id})"/></svg>`;

// ------------------------------------------------------------------ lesson art: small diagrams, drawn here (viewBox 320 x 180)
let GID = 0;
const INK = "#8E9BF2", PALE = "#D5DBFF", HOTC = "#F59E0B";
function svg(body) {
  const id = "a" + (GID++);
  return `<svg viewBox="0 0 320 180"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3E54D8"/><stop offset="1" stop-color="#7C8CF8"/></linearGradient>
    <linearGradient id="${id}s" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7C8CF8"/><stop offset="1" stop-color="#8FD3FF"/></linearGradient></defs>${body(id)}</svg>`;
}

arrows.forEach(a => { const L = a.getTotalLength(); a.style.strokeDasharray = L; a.dataset.l = L; });
bars.forEach(b => { b.style.transformBox = "fill-box"; b.style.transformOrigin = "50% 100%"; });
const name = mk("div", "w ink", S9, "skillmaxing"); name.style.fontSize = "150px"; name.style.fontWeight = 600; name.style.letterSpacing = "-.035em";
const url = mk("div", "w", S9, "skillmaxing.xyz"); url.style.cssText += ";font-size:34px;color:#3B3854;letter-spacing:0";
function scene9(t) {
  show(S9, t > 28.3);
  if (t <= 28.3) return;
  bars.forEach((b, i) => { b.style.transform = `scaleY(${E.back(clamp((t - 28.4 - i * .07) / .35)).toFixed(4)})`; });
  arrows.forEach((a, i) => { a.style.strokeDashoffset = a.dataset.l * (1 - P(t, 28.62 + i * .14, 28.95 + i * .14, E.out)); });
  const nw = name.offsetWidth, gap = 44, tot = 150 + gap + nw;
  const slide = P(t, 28.95, 29.5, E.io);
  const mx = lerp(960 - 75, 960 - tot / 2, slide);
  const settle = 1 + .025 * P(t, 29.5, 33, E.lin);
  S9.style.transformOrigin = "960px 540px"; S9.style.transform = `scale(${settle})`;
  css(mark, { x: mx, y: 540 - 88, s: lerp(.6, 1, E.back(clamp((t - 28.35) / .45))), o: clamp((t - 28.35) / .12) });
  const ne = P(t, 29.05, 29.6, E.out5);
  css(name, { x: mx + 150 + gap + (1 - ne) * -60, y: 540 - name.offsetHeight / 2 - 6, o: ne, b: (1 - ne) * 16 });
  name.style.clipPath = `inset(-20% ${((1 - ne) * 100).toFixed(2)}% -20% -5%)`;
  css(url, { x: 960 - url.offsetWidth / 2, y: 930 + (1 - P(t, 29.6, 30.1)) * 16, o: P(t, 29.6, 30.1) });
}

// ------------------------------------------------------------------ driver
const TOTAL = 33.0;
function render(t) {
  cursor.style.visibility = "hidden";      // a scene that wants the pointer shows it
  scene1(t); scene2(t); scene3(t); scene4(t); scene5(t); scene6(t); scene7(t); scene8(t); scene9(t);
}
window.TOTAL = TOTAL;
window.render = render;
window.ready = (async () => {
  await document.fonts.ready;
  await Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
  [L1, L2, L3, L4, L5, L8].forEach(l => l.measure());
  render(0);
  return true;
})();
window.ready.then(() => {
  const h = location.hash;
  if (h.startsWith("#t=")) render(parseFloat(h.slice(3)));
  else if (h === "#play") { const t0 = performance.now(); const loop = () => { render(((performance.now() - t0) / 1000) % TOTAL); requestAnimationFrame(loop); }; loop(); }
});
